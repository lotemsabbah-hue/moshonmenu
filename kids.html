<!DOCTYPE html>
<html lang="he" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>שיפודי מושון - ילדים</title>

<style>
:root{
  --bg:#000;
  --card:#1a1a1a;
  --gold:#d4af37;
  --muted:#cfcfcf;
  --shadow:0 0 22px rgba(212,175,55,.18);
}

*{ box-sizing:border-box; }

body{
  margin:0;
  font-family:"Segoe UI",Arial,sans-serif;
  background: radial-gradient(1200px 800px at 50% -20%, rgba(212,175,55,.10), transparent 55%), #000;
  color:#fff;
  padding:20px 14px 40px;
  text-align:center;
}

.container{
  max-width:560px;
  margin:auto;
  position:relative;
}

/* חזור */
.back{
  position:absolute;
  top:0;
  left:0;
  border:2px solid var(--gold);
  background:#1f1f1f;
  color:#fff;
  padding:8px 14px;
  border-radius:10px;
  font-weight:800;
  cursor:pointer;
}
.back:hover{
  box-shadow:0 0 12px rgba(212,175,55,.25);
}

/* לוגו */
.logo{
  display:block;
  margin:50px auto 30px;
  width:200px;
  max-width:80%;
}

/* תמונת ילדים */
.kids-img{
  width:260px;
  max-width:85%;
  margin:10px auto 30px;
  display:block;
}

/* כותרת בסגנון index */
.section-title{
  display:inline-block;
  border:2px solid var(--gold);
  background:linear-gradient(180deg,#2a2a2a,#1f1f1f);
  padding:10px 24px;
  border-radius:14px;
  font-size:24px;
  font-weight:900;
  box-shadow:var(--shadow);
  margin-bottom:30px;
}

/* פריט */
.menu-item{
  display:flex;
  justify-content:space-between;
  border-bottom:1px dashed var(--gold);
  padding:10px 0;
  font-size:18px;
}

.price{
  font-weight:bold;
  white-space:nowrap;
}

</style>
</head>

<body>

<div class="container">

<button class="back" onclick="history.back()">חזור</button>

<img src="logo.png" class="logo" alt="שיפודי מושון">

<img src="kids.png" class="kids-img" alt="ילדים">

<div class="section-title">ילדים</div>

<div class="menu-item">
  <span>פרגית + צ'יפס + שתיה</span>
  <span class="price">₪59</span>
</div>

<div class="menu-item">
  <span>שניצלונים + צ'יפס + שתיה</span>
  <span class="price">₪59</span>
</div>

<div class="menu-item">
  <span>לבבות עוף + צ'יפס + שתיה</span>
  <span class="price">₪59</span>
</div>

<div class="menu-item">
  <span>תוספת אורז</span>
  <span class="price">₪12</span>
</div>

</div>

</body>
</html>
