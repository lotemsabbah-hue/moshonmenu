<!DOCTYPE html>
<html lang="he" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>שיפודי מושון - קינוחים</title>

<style>
:root{
  --gold:#d4af37;
}

*{ box-sizing:border-box; }

body{
  margin:0;
  font-family:"Segoe UI",Arial,sans-serif;
  background: radial-gradient(1000px 700px at 50% -20%, rgba(212,175,55,.08), transparent 60%), #000;
  color:#fff;
  padding:20px 14px 50px;
}

.container{
  max-width:560px;
  margin:auto;
  position:relative;
  text-align:center;
}

/* חזור */
.back{
  position:absolute;
  top:0;
  left:0;
  border:2px solid var(--gold);
  background:#1f1f1f;
  color:#fff;
  padding:7px 14px;
  border-radius:10px;
  font-weight:700;
  font-size:15px;
  cursor:pointer;
}

/* לוגו */
.logo{
  display:block;
  margin:55px auto 30px;
  width:190px;
  max-width:75%;
}

/* בלוק כותרת עם אייקון */
.title-wrapper{
  position:relative;
  display:inline-block;
  margin-top:40px;
}

.section-title{
  border:2px solid var(--gold);
  background:linear-gradient(180deg,#262626,#1c1c1c);
  padding:12px 30px;
  border-radius:16px;
  font-size:26px;
  font-weight:800;
}

/* האייקון יושב על הכותרת */
.dessert-img{
  position:absolute;
  top:-60px;
  left:50%;
  transform:translateX(-50%);
  width:120px;
}

/* רשימה */
.menu{
  margin-top:60px;
  text-align:right;
}

.item{
  display:flex;
  justify-content:space-between;
  align-items:center;
  border-bottom:1px dashed rgba(212,175,55,.9);
  padding:14px 0;
  font-size:20px;
  font-weight:700;
}

/* מחיר בסטייל מודגש */
.price{
  font-size:28px;
  font-weight:900;
  color:#f5f0df;
  letter-spacing:1px;
}

@media(max-width:420px){
  .section-title{ font-size:22px; }
  .item{ font-size:18px; }
  .price{ font-size:24px; }
}
</style>
</head>

<body>

<div class="container">

<button class="back" onclick="history.back()">חזור</button>

<img src="logo.png" class="logo" alt="שיפודי מושון">

<div class="title-wrapper">
    <img src="dessert.png" class="dessert-img" alt="קינוחים">
    <div class="section-title">קינוחים</div>
</div>

<div class="menu">

  <div class="item">
    <span>כדור של אושר</span>
    <span class="price">₪34</span>
  </div>

  <div class="item">
    <span>מלבי</span>
    <span class="price">₪34</span>
  </div>

  <div class="item">
    <span>בוואריה</span>
    <span class="price">₪34</span>
  </div>

  <div class="item">
    <span>עוגת שוקולד</span>
    <span class="price">₪34</span>
  </div>

  <div class="item">
    <span>קרם ברולה</span>
    <span class="price">₪34</span>
  </div>

</div>

</div>

</body>
</html>
