<!DOCTYPE html>
<html lang="he" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>שיפודי מושון - תפריט</title>

<style>
:root{
  --gold:#d4af37;
  --shadow:0 0 18px rgba(212,175,55,.15);
}

*{ box-sizing:border-box; }

body{
  margin:0;
  font-family:"Segoe UI",Arial,sans-serif;
  background: radial-gradient(1000px 700px at 50% -20%, rgba(212,175,55,.08), transparent 60%), #000;
  color:#fff;
  padding:30px 16px 60px;
  text-align:center;
}

.container{
  max-width:500px;
  margin:auto;
  position:relative;
}

.logo{
  width:220px;
  max-width:85%;
  margin:20px auto 40px;
  display:block;
}

/* חזור */
.back-btn{
  position:absolute;
  top:0;
  left:0;
  background:#1e1e1e;
  border:2px solid var(--gold);  /* מסגרת זהב */
  color:#fff;
  padding:10px 14px;
  border-radius:12px;
  font-weight:800;
  cursor:pointer;
}

.back-btn span{
  color:var(--gold);
  margin-left:6px;
}

h1{
  color:var(--gold);
  font-size:24px;
  margin:0 0 6px;
}

.subtitle{
  color:#cfcfcf;
  margin:0 0 22px;
  font-size:14px;
}

/* כפתורים */
.menu-btn{
  display:flex;
  align-items:center;
  justify-content:space-between;
  width:100%;
  margin:14px 0;
  padding:16px 20px;
  font-size:20px;
  font-weight:900;
  text-decoration:none;
  color:#fff;
  background:linear-gradient(180deg,#262626,#1c1c1c);
  border:2px solid var(--gold);   /* מסגרת זהב */
  border-radius:18px;
  box-shadow:var(--shadow);
  transition:all .2s ease;
}

.menu-btn:hover{
  background:#2f2f2f;
  box-shadow:0 0 20px rgba(212,175,55,.25);
  transform:scale(1.02);
}

.menu-btn:active{
  transform:scale(.98);
}

.right{
  display:flex;
  align-items:center;
  gap:10px;
  text-align:right;
}

.badge{
  width:34px;
  height:34px;
  border-radius:10px;
  background:#111;
  display:flex;
  align-items:center;
  justify-content:center;
  color:var(--gold);
  font-weight:900;
}

.chev{
  color:var(--gold);
  font-size:18px;
  font-weight:900;
}

@media(max-width:420px){
  .menu-btn{ font-size:18px; }
}
</style>
</head>

<body>

<div class="container">

  <button class="back-btn" onclick="history.back()">
    <span>›</span> חזור
  </button>

  <img src="logo.png" class="logo" alt="שיפודי מושון">

  <h1>תפריט</h1>
  <div class="subtitle">בחרו קטגוריה</div>

  <a class="menu-btn" href="starter-mains.html">
    <span class="right"><span class="badge">1</span> ראשונות ועיקריות</span>
    <span class="chev">‹</span>
  </a>

  <a class="menu-btn" href="steaks.html">
    <span class="right"><span class="badge">2</span> סטייקים</span>
    <span class="chev">‹</span>
  </a>

  <a class="menu-btn" href="kids.html">
    <span class="right"><span class="badge">3</span> ילדים</span>
    <span class="chev">‹</span>
  </a>

  <a class="menu-btn" href="business.html">
    <span class="right"><span class="badge">4</span> עסקיות</span>
    <span class="chev">‹</span>
  </a>

  <a class="menu-btn" href="desserts.html">
    <span class="right"><span class="badge">5</span> קינוחים</span>
    <span class="chev">‹</span>
  </a>

</div>

</body>
</html>
