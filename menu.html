<!DOCTYPE html>
<html lang="he" dir="rtl">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>שיפודי מושון - תפריט</title>

  <style>
    :root{
      --bg:#000;
      --card:#1a1a1a;
      --card2:#222;
      --gold:#d4af37;
      --muted:#cfcfcf;
      --border:#333;
      --shadow: 0 0 22px rgba(212,175,55,.18);
    }

    *{ box-sizing:border-box; }
    body{
      margin:0;
      font-family:"Segoe UI",system-ui,-apple-system,Arial,sans-serif;
      background: radial-gradient(1200px 800px at 50% -20%, rgba(212,175,55,.10), transparent 55%), #000;
      color:#fff;
      padding: 14px;
      text-align:center;
      min-height:100vh;
    }

    .container{
      max-width: 560px;
      margin: 0 auto;
      background: linear-gradient(180deg, #1b1b1b, #141414);
      border: 1px solid var(--gold);
      border-radius: 22px;
      padding: 18px;
      box-shadow: var(--shadow);
      position: relative;
    }

    /* כפתור חזור - שמאל (ב-LTR זה שמאל, ב-RTL נשמור שמאל עם left) */
    .back-btn{
      position:absolute;
      top: 14px;
      left: 14px;
      border: 2px solid var(--gold);
      background: linear-gradient(180deg, #2a2a2a, #1f1f1f);
      color:#fff;
      border-radius: 12px;
      padding: 10px 12px;
      font-weight: 900;
      cursor:pointer;
      display:flex;
      align-items:center;
      gap: 8px;
      box-shadow: 0 0 0 rgba(212,175,55,0);
      transition: .12s;
    }
    .back-btn:hover{ box-shadow: 0 0 14px rgba(212,175,55,.25); }
    .back-btn:active{ transform: scale(.99); }
    .back-btn .arrow{ color: var(--gold); font-weight: 900; }

    /* לוגו באמצע */
    .logo-wrap{
      width:100%;
      display:flex;
      justify-content:center;
      margin-top: 6px;
      margin-bottom: 10px;
    }
    .logo{
      width: 220px;
      max-width: 80%;
      height: auto;
      border-radius: 16px;
      border: 1px solid rgba(212,175,55,.35);
      box-shadow: 0 0 18px rgba(212,175,55,.18);
      background:#0b0b0b;
      display:block;
    }

    h1{
      margin: 10px 0 6px;
      color: var(--gold);
      font-size: 24px;
      letter-spacing: .2px;
    }
    .subtitle{
      margin: 0 0 14px;
      color: var(--muted);
      font-size: 13px;
      line-height: 1.4;
    }

    /* אותו עיצוב כפתורים כמו בדף index */
    .btns{
      display: grid;
      gap: 10px;
      margin-top: 10px;
    }

    .btn{
      width: 100%;
      border: 2px solid var(--gold);
      background: linear-gradient(180deg, #2a2a2a, #1f1f1f);
      color: #fff;
      border-radius: 14px;
      padding: 14px 12px;
      font-size: 18px;
      font-weight: 800;
      cursor: pointer;
      text-decoration: none;
      display:flex;
      align-items:center;
      justify-content: space-between;
      gap: 10px;
      transition: transform .08s ease, box-shadow .12s ease, background .12s ease;
      box-shadow: 0 0 0 rgba(212,175,55,0);
    }

    .btn:active{ transform: scale(.99); }
    .btn:hover{
      box-shadow: 0 0 14px rgba(212,175,55,.25);
      background: linear-gradient(180deg, #303030, #242424);
    }

    .btn .right{
      display:flex;
      align-items:center;
      gap:10px;
      text-align:right;
    }

    .badge{
      min-width: 34px;
      height: 34px;
      border-radius: 10px;
      background: #111;
      border: 1px solid #3a3a3a;
      display:flex;
      align-items:center;
      justify-content:center;
      color: var(--gold);
      font-weight: 900;
    }

    .chev{
      color: var(--gold);
      font-weight: 900;
      font-size: 18px;
    }

    @media (max-width:420px){
      .back-btn{ padding: 9px 10px; font-size: 14px; }
      .btn{ font-size: 17px; }
    }
  </style>
</head>

<body>
  <div class="container">
    <!-- חזור לדף הקודם -->
    <button class="back-btn" type="button" onclick="history.back()">
      <span class="arrow">›</span>
      חזור
    </button>

    <div class="logo-wrap">
      <img class="logo" src="logo.png" alt="שיפודי מושון - לוגו" />
    </div>

    <h1>תפריט</h1>
    <div class="subtitle">בחרו קטגוריה</div>

    <div class="btns">
      <a class="btn" href="starters-mains.html">
        <span class="right"><span class="badge">1</span> ראשונות ועיקריות</span>
        <span class="chev">‹</span>
      </a>

      <a class="btn" href="steaks.html">
        <span class="right"><span class="badge">2</span> סטייקים</span>
        <span class="chev">‹</span>
      </a>

      <a class="btn" href="kids.html">
        <span class="right"><span class="badge">3</span> ילדים</span>
        <span class="chev">‹</span>
      </a>

      <a class="btn" href="business.html">
        <span class="right"><span class="badge">4</span> עסקיות</span>
        <span class="chev">‹</span>
      </a>

      <a class="btn" href="desserts.html">
        <span class="right"><span class="badge">5</span> קינוחים</span>
        <span class="chev">‹</span>
      </a>
    </div>
  </div>
</body>
</html>
