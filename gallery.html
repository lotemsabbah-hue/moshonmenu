<!DOCTYPE html>
<html lang="he" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>שיפודי מושון - גלריה</title>

<style>
:root{
  --gold:#d4af37;
  --shadow:0 0 18px rgba(212,175,55,.15);
}

*{ box-sizing:border-box; }

body{
  margin:0;
  font-family:"Segoe UI",Arial,sans-serif;
  background: radial-gradient(1000px 700px at 50% -20%, rgba(212,175,55,.08), transparent 60%), #000;
  color:#fff;
  padding:20px 14px 50px;
}

.container{
  max-width:900px;
  margin:auto;
  position:relative;
  text-align:center;
}

/* חזור */
.back{
  position:absolute;
  top:0;
  left:0;
  border:2px solid var(--gold);
  background:#1f1f1f;
  color:#fff;
  padding:6px 12px;
  border-radius:10px;
  font-weight:700;
  font-size:14px;
  cursor:pointer;
}

.logo{
  display:block;
  margin:45px auto 18px;
  width:200px;
}

.title{
  display:inline-block;
  border:2px solid var(--gold);
  background:linear-gradient(180deg,#262626,#1c1c1c);
  padding:10px 24px;
  border-radius:16px;
  font-size:22px;
  font-weight:900;
  box-shadow:var(--shadow);
  margin-bottom:30px;
}

/* גריד */
.grid{
  display:grid;
  grid-template-columns:repeat(3, 1fr);
  gap:20px;
}

@media(max-width:900px){
  .grid{ grid-template-columns:repeat(2, 1fr); }
}

@media(max-width:500px){
  .grid{ grid-template-columns:1fr; }
}

/* מסגרת */
.frame{
  background:#fff;
  padding:8px;
  border-radius:16px;
  box-shadow:0 15px 30px rgba(0,0,0,.35);
  overflow:hidden;
}

/* גודל אחיד */
.frame img{
  width:100%;
  height:260px;              /* גובה אחיד */
  object-fit:cover;          /* חיתוך מקצועי */
  border-radius:12px;
  display:block;
}

</style>
</head>

<body>

<div class="container">

<button class="back" onclick="history.back()">חזור</button>

<img src="logo.png" class="logo" alt="שיפודי מושון">
<div class="title">גלריה</div>

<div class="grid">

  <div class="frame"><img src="g1.jpg" alt=""></div>
  <div class="frame"><img src="g2.jpg" alt=""></div>
  <div class="frame"><img src="g3.jpg" alt=""></div>
  <div class="frame"><img src="g4.jpg" alt=""></div>
  <div class="frame"><img src="g5.jpg" alt=""></div>
  <div class="frame"><img src="g6.jpg" alt=""></div>

</div>

</div>

</body>
</html>
