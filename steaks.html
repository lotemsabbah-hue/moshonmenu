<!DOCTYPE html>
<html lang="he" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>שיפודי מושון - סטייקים</title>

<style>
:root{
  --bg:#000;
  --card:#1a1a1a;
  --gold:#d4af37;
  --muted:#cfcfcf;
  --shadow: 0 0 22px rgba(212,175,55,.18);
}

*{ box-sizing:border-box; }

body{
  margin:0;
  font-family:"Segoe UI",Arial,sans-serif;
  background: radial-gradient(1200px 800px at 50% -20%, rgba(212,175,55,.10), transparent 55%), #000;
  color:#fff;
  min-height:100vh;
  padding:20px 14px;
}

.container{
  max-width:560px;
  margin:auto;
  position:relative;
  text-align:center;
}

/* חזור */
.back{
  position:absolute;
  top:0;
  left:0;
  border:2px solid var(--gold);
  background:#1f1f1f;
  color:#fff;
  padding:8px 14px;
  border-radius:10px;
  font-weight:800;
  cursor:pointer;
}
.back:hover{
  box-shadow:0 0 12px rgba(212,175,55,.25);
}

/* לוגו */
.logo{
  display:block;
  margin:50px auto 40px;
  width:200px;
  max-width:80%;
}

/* כותרת בסגנון index */
.section-title{
  display:inline-block;
  border:2px solid var(--gold);
  background:linear-gradient(180deg,#2a2a2a,#1f1f1f);
  padding:12px 28px;
  border-radius:14px;
  font-size:28px;
  font-weight:900;
  box-shadow:var(--shadow);
  margin-bottom:40px;
}

/* שם המנה */
.subtitle{
  font-size:26px;
  font-weight:800;
  margin-bottom:10px;
}

/* קו מקווקו זהב */
.dashed{
  width:90%;
  margin:10px auto 20px;
  border-bottom:2px dashed var(--gold);
}

/* מחיר */
.price{
  font-size:64px;
  font-weight:900;
  color:#f5f0df;
  letter-spacing:1px;
}

@media(max-width:420px){
  .price{ font-size:52px; }
  .section-title{ font-size:22px; }
}
</style>
</head>

<body>

<div class="container">

<button class="back" onclick="history.back()">חזור</button>

<img src="logo.png" class="logo" alt="שיפודי מושון">

<div class="section-title">סטייקים</div>

<div class="subtitle">סטייק זוגות פרימיום</div>
<div class="dashed"></div>

<div class="price">₪189</div>

</div>

</body>
</html>
